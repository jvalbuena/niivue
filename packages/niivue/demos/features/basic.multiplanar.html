<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>Basic Multiplanar</title>
    <link rel="stylesheet" href="light.css" />
  </head>
  <body>
    <noscript>
      <strong>niivue requires JavaScript.</strong>
    </noscript>
    <header>
      <select id="sliceType">
        <option value="0">Axial</option>
        <option value="1">Coronal</option>
        <option value="2">Sagittal</option>
        <option value="4">Render</option>
        <option value="3" selected>A+C+S+R</option>
      </select>
      <button id="toggleOrientation">Hide Orientation Text</button>
    </header>
    <main id="container" style="width: 100%; height: 100%; min-width: 0">
      <canvas id="gl1"></canvas>
    </main>
    <footer id="intensity">&nbsp;</footer>
  </body>
</html>
<!-- <script type="module" async></script> -->
<script type="module" async>
  import * as niivue from '../dist/index.js'
  var drop = document.getElementById('sliceType')
  drop.onchange = function () {
    let st = parseInt(document.getElementById('sliceType').value)
    nv1.setSliceType(st)
  }
  function handleIntensityChange(data) {
    document.getElementById('intensity').innerHTML = '&nbsp;&nbsp;' + data.string
    console.log(data)
  }
  var volumeList1 = [
    {
      url: '../images/mni152.nii.gz',
      colormap: 'gray',
      visible: true,
      opacity: 1
    },
    {
      url: '../images/hippo.nii.gz',
      colormap: 'red',
      visible: true,
      opacity: 1
    }
  ]
  var nv1 = new niivue.Niivue({
    dragAndDropEnabled: true,
    onLocationChange: handleIntensityChange,
    textHeight: 0.05
  })
  await nv1.attachTo('gl1')
  nv1.opts.isResizeCanvas = true
  await nv1.loadVolumes(volumeList1)
  nv1.setSliceType(nv1.sliceTypeMultiplanar)

  // --- iframe resize fix ---
  const _container = document.getElementById('container')

  function syncCanvasSize() {
    const w = _container.clientWidth
    const h = _container.clientHeight
    if (w > 0 && h > 0) {
      gl1.width = w
      gl1.height = h
      nv1.resizeListener()
    }
  }

  // Fire after two paint frames so layout is fully committed
  requestAnimationFrame(() => requestAnimationFrame(syncCanvasSize))

  // Keep in sync on every panel/window resize
  new ResizeObserver(syncCanvasSize).observe(_container)

  // Handle postMessage signals from a parent page
  window.addEventListener('message', (e) => {
    if (!e.data || (e.data.type !== 'resize' && e.data.type !== 'init')) return
    syncCanvasSize()
  })
  let orientationVisible = true
  nv1.setIsOrientationTextVisible(orientationVisible)
  const toggleBtn = document.getElementById('toggleOrientation')
  toggleBtn.addEventListener('click', () => {
    orientationVisible = !orientationVisible
    nv1.setIsOrientationTextVisible(orientationVisible)
    toggleBtn.textContent = orientationVisible ? 'Hide Orientation Text' : 'Show Orientation Text'
  })
</script>
